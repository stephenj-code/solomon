# dnsmasq config for project-solomon LAN split DNS.
# Deploy to: /etc/dnsmasq.d/project-solomon.conf on agx-orin-prod-1
#
# Bootstrap.sh copies this file and restarts dnsmasq.
# Install dnsmasq if not present: sudo apt install dnsmasq
#
# Effect: LAN devices with DNS set to 192.168.1.49 resolve
#   *.project-solomon.ai → 192.168.1.49 (Istio IngressGateway, direct LAN path)
# External devices (using 8.8.8.8 etc.) hit Cloudflare → tunnel → cluster.
#
# To use on a LAN device: set DNS server to 192.168.1.49

# Wildcard: all subdomains of project-solomon.ai → IngressGateway on agx-orin-prod-1
address=/project-solomon.ai/192.168.1.49

# Forward all other queries to upstream (Cloudflare DNS)
server=1.1.1.1
server=1.0.0.1

# Listen on all interfaces on agx-orin-prod-1
listen-address=0.0.0.0
bind-interfaces

# Cache size
cache-size=1000
