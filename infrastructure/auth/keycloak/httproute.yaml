# HTTPRoute — keycloak.project-solomon.ai
# Routes both HTTPS (LAN) and HTTP (cloudflared tunnel) listeners to Keycloak.
# Parent gateway is in istio-system namespace — ReferenceGrant not required
# because allowedRoutes.namespaces.from=All is set on the Gateway listeners.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: keycloak
  namespace: auth
spec:
  parentRefs:
    - name: main
      namespace: istio-system
      sectionName: https
    - name: main
      namespace: istio-system
      sectionName: http
  hostnames:
    - keycloak.project-solomon.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: keycloak
          port: 8080
