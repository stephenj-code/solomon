# vllm — Nemotron3 Nano 30B-A3B (NVIDIA MoE)
#
# Runs vllm serving Nemotron3 Nano 30B-A3B-Instruct.
# MoE architecture: 30B total params, 3B active per token — fits in AGX Orin VRAM.
# Exposes an OpenAI-compatible /v1 API on port 8000.
# LiteLLM routes the `smart` alias here.
#
# Model image: dustynv/vllm:r36.4.0 — Jetson AI Lab build for JetPack 6.x.
# Verify at https://jetson-ai-lab.com/models before Phase 13.
#
# Model is pulled from HuggingFace on first start (vllm auto-downloads).
# HF_HOME is mounted to the vllm-model-cache PVC so the model persists across restarts.
#
# Pinned to agx-orin-prod-1 — 61 GB RAM, GPU, 1 TB SSD.
# agx-orin-prod-1 carries the control-plane taint; toleration required.
#
# Secrets required (sealed-secrets/):
#   huggingface-token — HUGGING_FACE_HUB_TOKEN for model download on first start.
#
# HuggingFace model ID: nvidia/Nemotron-3-Nano-30B-A3B-Instruct
# Verify at https://huggingface.co/nvidia before Phase 13.
#
# Resource allocation:
#   GPU: 1 (full AGX Orin GPU)
#   RAM: request 8Gi, limit 56Gi
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vllm
  namespace: ai
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vllm
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vllm
  template:
    metadata:
      labels:
        app: vllm
    spec:
      serviceAccountName: vllm
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: agx-orin-prod-1
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: vllm
          image: dustynv/vllm:r36.4.0
          command:
            - python3
            - -m
            - vllm.entrypoints.openai.api_server
            - --model
            - nvidia/Nemotron-3-Nano-30B-A3B-Instruct
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --max-model-len
            - "8192"
            - --gpu-memory-utilization
            - "0.90"
            - --dtype
            - auto
          env:
            - name: HUGGING_FACE_HUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: huggingface-token
                  key: HF_TOKEN
            - name: HF_HOME
              value: /cache
          ports:
            - containerPort: 8000
              name: http
          resources:
            requests:
              memory: 8Gi
              cpu: 2000m
            limits:
              memory: 56Gi
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: model-cache
              mountPath: /cache
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 5
      volumes:
        - name: model-cache
          persistentVolumeClaim:
            claimName: vllm-model-cache
---
apiVersion: v1
kind: Service
metadata:
  name: vllm
  namespace: ai
spec:
  selector:
    app: vllm
  ports:
    - port: 8000
      targetPort: 8000
      name: http
