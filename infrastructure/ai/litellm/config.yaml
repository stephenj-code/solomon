# LiteLLM proxy configuration.
# Mounted read-only at /etc/litellm/config.yaml in the litellm container.
#
# Model aliases exposed to all consumers:
#   fast   — Muse Glimmer 30B via llama-server (llama.cpp, highest throughput)
#   smart  — Nemotron3 Nano 30B-A3B via vllm (stronger reasoning, MoE)
#   glm    — Together AI GLM (GLM-5.2 / GLM-5.3)
#   kimi   — Together AI Kimi K3
#
# Secrets injected at runtime via env vars (see sealed-secrets/):
#   LITELLM_MASTER_KEY   — master API key for admin operations
#   TOGETHER_API_KEY     — Together AI (glm + kimi aliases)
#   DATABASE_URL         — PostgreSQL for spend tracking and virtual keys
#
# Agent registry: all agents are registered as LiteLLM virtual keys during
# provisioning (solomon-app-template workflow). This config only manages models.
#
# VERIFY Together AI model IDs before Phase 13:
#   https://api.together.ai/models
apiVersion: v1
kind: ConfigMap
metadata:
  name: litellm-config
  namespace: ai
data:
  config.yaml: |
    model_list:

      # ── Local inference ────────────────────────────────────────────────────────
      # Both services run on agx-orin-prod-1. Reachable via cluster DNS.

      - model_name: fast
        litellm_params:
          model: openai/muse-glimmer-30b
          api_base: http://llama-server.ai.svc.cluster.local:8080/v1
          api_key: none

      - model_name: smart
        litellm_params:
          model: openai/nemotron3-nano-30b-a3b
          api_base: http://vllm.ai.svc.cluster.local:8000/v1
          api_key: none

      # ── Together AI ────────────────────────────────────────────────────────────
      # Verify exact model IDs at https://api.together.ai/models before Phase 13.

      - model_name: glm
        litellm_params:
          # GLM-5.2 — THUDM/GLM-Z1 series on Together AI
          model: together_ai/THUDM/glm-z1-32b
          api_key: os.environ/TOGETHER_API_KEY

      - model_name: kimi
        litellm_params:
          # Kimi K3 — verify exact model slug on Together AI
          model: together_ai/moonshotai/Kimi-K1.5-32K
          api_key: os.environ/TOGETHER_API_KEY

    litellm_settings:
      master_key: os.environ/LITELLM_MASTER_KEY
      database_url: os.environ/DATABASE_URL
      # Store spend per virtual key for agent cost tracking.
      success_callback: []
      failure_callback: []

    router_settings:
      routing_strategy: simple-shuffle
      num_retries: 2
      timeout: 300
      # Retry on these status codes only.
      retry_on_status_codes: [429, 502, 503, 504]
