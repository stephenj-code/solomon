# MinIO — S3-compatible object storage on the 1TB SSD (agx-orin-prod-1).
# Provides the backup target for Velero. Pinned to agx-orin-prod-1 via nodeSelector.
#
# API endpoint:     http://minio.backup.svc.cluster.local:9000
# Console URL:      https://minio.project-solomon.ai (Keycloak SSO via oauth2-proxy)
#
# Buckets created by the minio-setup Job below:
#   velero      — Velero cluster backups
#   cnpg-backup — CloudNativePG WAL/base backups (future use)
#
# Credentials stored as SealedSecret. Seal before Phase 13:
#   kubectl create secret generic minio-root \
#     --namespace backup \
#     --from-literal=MINIO_ROOT_USER=admin \
#     --from-literal=MINIO_ROOT_PASSWORD=<strong-password> \
#     --dry-run=client -o yaml | \
#     kubeseal --cert scripts/sealed-secrets.pem --format yaml \
#     > infrastructure/backup/minio/sealed-secrets/minio-root-sealed.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: minio
  namespace: backup
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: minio
  namespace: backup
spec:
  serviceName: minio
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      serviceAccountName: minio
      # Pin to agx-orin-prod-1 — 1TB SSD is only on this node.
      nodeSelector:
        kubernetes.io/hostname: agx-orin-prod-1
      containers:
        - name: minio
          image: quay.io/minio/minio:RELEASE.2024-07-16T23-46-41Z
          command:
            - minio
            - server
            - /data
            - --console-address
            - ":9001"
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
            - name: TZ
              value: America/New_York
          ports:
            - name: api
              containerPort: 9000
            - name: console
              containerPort: 9001
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /minio/health/ready
              port: 9000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /minio/health/live
              port: 9000
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: local-path
        resources:
          requests:
            storage: 800Gi
---
# API service — used by Velero and CNPG for S3 object storage.
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: backup
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
      targetPort: 9000
    - name: console
      port: 9001
      targetPort: 9001
---
# HTTPRoute — minio.project-solomon.ai → MinIO console (:9001).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: minio
  namespace: backup
spec:
  parentRefs:
    - name: main
      namespace: istio-system
      sectionName: https
    - name: main
      namespace: istio-system
      sectionName: http
  hostnames:
    - minio.project-solomon.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: minio
          port: 9001
---
# One-shot Job: creates the required MinIO buckets on first deploy.
# Retries until MinIO is ready (backoffLimit covers the startup window).
apiVersion: batch/v1
kind: Job
metadata:
  name: minio-setup
  namespace: backup
  annotations:
    # Re-run this job manually if buckets need to be recreated:
    #   kubectl delete job minio-setup -n backup
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 20
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-minio
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until wget -qO- http://minio:9000/minio/health/ready 2>/dev/null; do
                echo "waiting for minio..."; sleep 5
              done
      containers:
        - name: mc
          image: quay.io/minio/mc:RELEASE.2024-07-15T17-46-06Z
          command:
            - sh
            - -c
            - |
              mc alias set local http://minio:9000 \
                "$MINIO_ROOT_USER" "$MINIO_ROOT_PASSWORD"
              mc mb --ignore-existing local/velero
              mc mb --ignore-existing local/cnpg-backup
              echo "MinIO buckets ready."
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: minio-root
                  key: MINIO_ROOT_PASSWORD
