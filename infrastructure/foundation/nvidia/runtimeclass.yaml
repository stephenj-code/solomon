# NVIDIA RuntimeClass — allows pods to request the nvidia container runtime.
# The `nvidia` handler is registered by the NVIDIA container toolkit (JetPack
# configures containerd with this handler automatically on Jetson nodes).
#
# Usage in pod spec:
#   spec:
#     runtimeClassName: nvidia
#     resources:
#       limits:
#         nvidia.com/gpu: "1"
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: nvidia
handler: nvidia
