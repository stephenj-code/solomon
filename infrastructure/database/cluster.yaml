# CloudNativePG shared Cluster — single primary instance for all application databases.
# Each application gets its own database within this cluster, provisioned by the
# solomon-app-template workflow via a Database CRD in infrastructure/database/databases/.
#
# Connection (read-write):  shared-rw.database.svc.cluster.local:5432
# Connection (read-only):   shared-r.database.svc.cluster.local:5432
#
# Superuser credentials auto-generated by CNPG and stored in:
#   Secret: shared-superuser  (namespace: database)
#
# Backup: Velero node-agent (kopia) backs up the PVC daily at 02:00 UTC.
# CNPG-native WAL archiving to MinIO is a future improvement (see Known Gaps
# in docs/solomon/project-state.md).
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shared
  namespace: database
spec:
  instances: 1

  # Pin to explicit image — ghcr.io/cloudnative-pg/postgresql:16 includes pgvector.
  # Any database in this cluster can enable vector search with:
  #   CREATE EXTENSION vector;
  # Used by agents that need semantic memory over computations, embeddings, or paper chunks.
  imageName: ghcr.io/cloudnative-pg/postgresql:16

  postgresql:
    parameters:
      timezone: America/New_York
      log_timezone: America/New_York

  storage:
    size: 350Gi
    storageClass: local-path

  # Pin to agx-orin-prod-1 — 1TB SSD is only on this node.
  # local-path PVC will land on /data/local-path-provisioner/ (see foundation/storage/).
  affinity:
    nodeSelector:
      kubernetes.io/hostname: agx-orin-prod-1
    tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule

  # CNPG manages the superuser secret automatically when not specified.
  # Retrieve credentials post-deploy:
  #   kubectl get secret shared-superuser -n database \
  #     -o jsonpath='{.data.password}' | base64 -d
