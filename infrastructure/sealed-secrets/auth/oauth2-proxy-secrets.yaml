# PLACEHOLDER — seal after Keycloak is running (Phase 13, after auth bootstrap).
#
# Creates: oauth2-proxy-secrets Secret in auth namespace
# Keys:
#   OAUTH2_PROXY_CLIENT_SECRET  — Keycloak OIDC client secret for oauth2-proxy
#   OAUTH2_PROXY_COOKIE_SECRET  — 32-byte base64 cookie encryption secret
#
# Prerequisites:
#   1. Keycloak realm "solomon" must exist
#   2. Create OIDC client "oauth2-proxy" in Keycloak admin console (confidential type)
#   3. Copy the client secret from the Credentials tab
#   4. Generate a cookie secret:
#        python3 -c 'import os,base64; print(base64.b64encode(os.urandom(32)).decode())'
#
# Sealing command:
#   kubectl create secret generic oauth2-proxy-secrets \
#     --namespace auth \
#     --from-literal=OAUTH2_PROXY_CLIENT_SECRET=<keycloak-client-secret> \
#     --from-literal=OAUTH2_PROXY_COOKIE_SECRET=<generated-32-byte-base64> \
#     --dry-run=client -o yaml | \
#     kubeseal --cert scripts/sealed-secrets.pem --format yaml \
#     > infrastructure/sealed-secrets/auth/oauth2-proxy-secrets.yaml
#
# Replace this entire file with the kubeseal output.
