# HTTPRoute — frigate.project-solomon.ai
#
# All traffic (browser + API) hits oauth2-proxy-frigate first.
# oauth2-proxy handles the Keycloak OIDC redirect flow for browsers and
# proxies authenticated requests upstream to Frigate at 192.168.1.49:5000.
# Unauthenticated requests are redirected to Keycloak login.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frigate
  namespace: nvr
spec:
  parentRefs:
    - name: main
      namespace: istio-system
      sectionName: https
    - name: main
      namespace: istio-system
      sectionName: http
  hostnames:
    - frigate.project-solomon.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: oauth2-proxy-frigate
          port: 4180
