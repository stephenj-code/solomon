# Jaeger all-in-one — distributed tracing.
# Single binary includes collector, query UI, and in-memory storage.
# Appropriate for a 3-node cluster; traces are not persisted across restarts.
#
# Ports:
#   16686 — query UI / HTTP API
#   14268 — HTTP collector (services send spans here)
#   14250 — gRPC collector
#   6831  — UDP agent (compact thrift)
#
# External access: jaeger.project-solomon.ai via HTTPRoute.
# Istio telemetry can be configured to send traces to port 14268.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jaeger
  namespace: observability
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jaeger
  namespace: observability
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jaeger
  template:
    metadata:
      labels:
        app: jaeger
    spec:
      serviceAccountName: jaeger
      containers:
        - name: jaeger
          image: jaegertracing/all-in-one:1.57
          env:
            - name: COLLECTOR_OTLP_ENABLED
              value: "true"
            - name: SPAN_STORAGE_TYPE
              value: memory
            - name: MEMORY_MAX_TRACES
              value: "50000"
          ports:
            - containerPort: 16686
              name: http-query
            - containerPort: 14268
              name: http-collector
            - containerPort: 14250
              name: grpc-collector
            - containerPort: 4317
              name: otlp-grpc
            - containerPort: 4318
              name: otlp-http
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 16686
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: jaeger
  namespace: observability
spec:
  selector:
    app: jaeger
  ports:
    - port: 16686
      targetPort: 16686
      name: http-query
    - port: 14268
      targetPort: 14268
      name: http-collector
    - port: 14250
      targetPort: 14250
      name: grpc-collector
    - port: 4317
      targetPort: 4317
      name: otlp-grpc
    - port: 4318
      targetPort: 4318
      name: otlp-http
---
# HTTPRoute — jaeger.project-solomon.ai
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: jaeger
  namespace: observability
spec:
  parentRefs:
    - name: main
      namespace: istio-system
      sectionName: https
    - name: main
      namespace: istio-system
      sectionName: http
  hostnames:
    - jaeger.project-solomon.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: jaeger
          port: 16686
