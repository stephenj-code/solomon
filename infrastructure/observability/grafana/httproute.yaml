# HTTPRoute — grafana.project-solomon.ai
# Grafana is deployed by the kube-prometheus-stack Helm app (argocd-apps/prometheus.yaml).
# Service name is "grafana" (set via grafana.fullnameOverride in Helm values).
# Port 80 — Grafana default HTTP port.
#
# Grafana has its own built-in auth. SSO via Keycloak can be configured in Phase 11.
#
# RUNTIME: seal grafana-admin secret before Phase 13:
#   kubectl create secret generic grafana-admin \
#     --namespace observability \
#     --from-literal=admin-user=admin \
#     --from-literal=admin-password=<strong-password> \
#     --dry-run=client -o yaml | \
#     kubeseal --cert scripts/sealed-secrets.pem --format yaml \
#     > infrastructure/observability/grafana/grafana-admin-sealed.yaml
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: observability
spec:
  parentRefs:
    - name: main
      namespace: istio-system
      sectionName: https
    - name: main
      namespace: istio-system
      sectionName: http
  hostnames:
    - grafana.project-solomon.ai
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: grafana
          port: 80
