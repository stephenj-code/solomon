# Allow Prometheus (observability namespace) to scrape metrics from all namespaces.
# Applied to every namespace that exposes metrics.
# Prometheus scrapes on port 9090 (self), 8080/9080/metrics (apps).
# Using a blanket "allow ingress from observability namespace" pattern.
#
# Apply this to each namespace that Prometheus needs to scrape.
# Currently: ai, auth, database, backup, mcp-servers, security, nvr, networking
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-scraping
  namespace: ai
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
---
