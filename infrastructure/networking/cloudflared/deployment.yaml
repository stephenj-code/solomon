# cloudflared — Cloudflare Tunnel connector.
# Establishes an outbound-only encrypted tunnel to Cloudflare's edge.
# External HTTPS hits Cloudflare → tunnel → this pod → IngressGateway :80
#
# The tunnel token is provisioned in the Cloudflare Zero Trust dashboard.
# Seal the token:
#   kubectl create secret generic cloudflare-tunnel-token \
#     --namespace networking \
#     --from-literal=token=<TOKEN> \
#     --dry-run=client -o yaml | \
#     kubeseal --cert scripts/sealed-secrets.pem --format yaml \
#     > infrastructure/networking/cloudflared/tunnel-token-sealed.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: networking
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: cloudflared
  namespace: networking
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cloudflared
  namespace: networking
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cloudflared
  template:
    metadata:
      labels:
        app: cloudflared
    spec:
      serviceAccountName: cloudflared
      containers:
        - name: cloudflared
          image: cloudflare/cloudflared:2024.8.2
          args:
            - tunnel
            - --no-autoupdate
            - run
          env:
            - name: TUNNEL_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cloudflare-tunnel-token
                  key: token
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /ready
              port: 2000
            initialDelaySeconds: 10
            periodSeconds: 10
