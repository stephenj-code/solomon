# Main cluster Gateway — single entry point for all *.project-solomon.ai traffic.
#
# port 443 (HTTPS): LAN traffic — TLS terminated here using wildcard-tls cert
#   from cert-manager. cert-manager writes this Secret to istio-system.
#
# port 80 (HTTP): cloudflared tunnel traffic — Cloudflare terminates TLS
#   externally; cloudflared forwards plain HTTP to this port on ClusterIP.
#
# All HTTPRoutes in any namespace reference this Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: main
  namespace: istio-system
spec:
  gatewayClassName: istio
  listeners:
    - name: https
      port: 443
      protocol: HTTPS
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: wildcard-tls
            namespace: istio-system
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: All
