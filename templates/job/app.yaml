# Provisioning config — read by provision.yaml on first push.
# Edit this before running: scripts/new-app.sh <name> [job|cronjob]
name: __APP_NAME__
type: __APP_TYPE__
solomon_version: __SOLOMON_VERSION__
namespace: __NAMESPACE__

# Jobs have no public URL — subdomain is intentionally blank.
subdomain: ""

needs:
  llm: false       # true → LiteLLM virtual key provisioned; allow policy added to ai ns
  database: false  # true → CloudNativePG Database CR committed to platform repo
  m2m: false       # true → Keycloak service account client (call other services)
