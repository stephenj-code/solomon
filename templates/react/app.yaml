# Provisioning config — read by provision.yaml workflow on first push.
# Edit this before running scripts/new-app.sh to describe what this app needs.
name: __APP_NAME__
type: agent          # agent | api | ui

# Subdomain: <subdomain>.project-solomon.ai
# Defaults to app name. Change if you want a shorter public URL.
subdomain: __APP_NAME__

# Kubernetes namespace. Defaults to app name.
# Use "agents" only for truly cross-cutting apps with no natural home namespace.
namespace: __APP_NAME__

needs:
  llm: true          # true → LiteLLM virtual key provisioned; allow policy added to ai ns
  database: false    # true → CloudNativePG Database CR committed to platform repo
  ui: false          # true → Keycloak browser client + oauth2-proxy config
  m2m: false         # true → Keycloak service account client (machine-to-machine auth)
