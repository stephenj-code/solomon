name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: arc-solomon   # self-hosted ARM64 runner on agx-orin-prod-1
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build image
        # npm install + tsc + vite build happen inside the Dockerfile
        # TypeScript errors fail the build here
        env:
          DOCKER_BUILDKIT: "1"
        run: |
          docker build \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --cache-from ghcr.io/stephenj-code/__APP_NAME__:latest \
            --tag ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }} \
            .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Semgrep SAST scan
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/javascript
        continue-on-error: true

      - name: Login to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }}
          docker tag \
            ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }} \
            ghcr.io/stephenj-code/__APP_NAME__:latest
          docker push ghcr.io/stephenj-code/__APP_NAME__:latest

      - name: Push semver tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          docker tag \
            ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }} \
            ghcr.io/stephenj-code/__APP_NAME__:${VERSION}
          docker push ghcr.io/stephenj-code/__APP_NAME__:${VERSION}

      - name: Patch deployment image tag
        if: github.ref == 'refs/heads/main'
        run: |
          sed -i \
            "s|ghcr.io/stephenj-code/__APP_NAME__:.*|ghcr.io/stephenj-code/__APP_NAME__:${{ steps.tag.outputs.sha }}|" \
            k8s/deployment.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --staged --quiet || git commit -m "chore: update image to ${{ steps.tag.outputs.sha }}"
          git push
