# Creates: keycloak-client Secret in __APP_NAME__ namespace
# Keys:
#   KEYCLOAK_CLIENT_ID      — Keycloak client ID for this app
#   KEYCLOAK_CLIENT_SECRET  — Keycloak client secret (confidential client)
#
# provision.yaml:
#   1. Creates a Keycloak client in the solomon realm
#   2. Extracts the client secret
#   3. Seals it with kubeseal → replaces this file
#   4. Commits back to this repo
#
# To reseal manually (e.g. after client secret rotation):
#   kubectl create secret generic keycloak-client \
#     --namespace __APP_NAME__ \
#     --from-literal=KEYCLOAK_CLIENT_ID=__APP_NAME__ \
#     --from-literal=KEYCLOAK_CLIENT_SECRET=<secret-from-keycloak> \
#     --dry-run=client -o yaml | \
#     kubeseal --cert path/to/sealed-secrets.pem --format yaml \
#     > k8s/sealed-secrets/keycloak-client.yaml
