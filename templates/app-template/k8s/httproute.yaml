apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: __APP_NAME__
  namespace: __APP_NAME__
spec:
  parentRefs:
    - name: main
      namespace: networking
      sectionName: https
  hostnames:
    - __APP_NAME__.project-solomon.ai
  rules:
    - backendRefs:
        - name: __APP_NAME__
          port: 80
