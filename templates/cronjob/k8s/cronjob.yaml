apiVersion: batch/v1
kind: CronJob
metadata:
  name: __APP_NAME__
  namespace: __NAMESPACE__
spec:
  schedule: "0 * * * *"       # every hour — edit this
  concurrencyPolicy: Forbid   # don't start a new run if previous is still running
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: __APP_NAME__
          containers:
            - name: __APP_NAME__
              image: ghcr.io/stephenj-code/__APP_NAME__:latest
              envFrom:
                - secretRef:
                    name: keycloak-client
                    optional: true
                - secretRef:
                    name: litellm-api-key
                    optional: true
              resources:
                requests:
                  cpu: 100m
                  memory: 256Mi
                limits:
                  memory: 1Gi
