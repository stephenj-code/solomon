name: reusable-provision
# Called by api, agent, react, and rust app repos.
# Runs once on first push. Idempotent — skips if .provisioned sentinel exists.

on:
  workflow_call:

jobs:
  provision:
    runs-on: arc-solomon
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Check if already provisioned
        id: check
        run: |
          if [ -f .provisioned ]; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      - name: Read app config
        if: steps.check.outputs.skip == 'false'
        id: config
        run: |
          pip install --quiet pyyaml
          python3 - <<'EOF'
          import yaml, os
          with open("app.yaml") as f:
              cfg = yaml.safe_load(f)
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"name={cfg['name']}\n")
              out.write(f"namespace={cfg['namespace']}\n")
              out.write(f"subdomain={cfg['subdomain']}\n")
              out.write(f"needs_llm={str(cfg['needs'].get('llm', False)).lower()}\n")
              out.write(f"needs_database={str(cfg['needs'].get('database', False)).lower()}\n")
              out.write(f"needs_ui={str(cfg['needs'].get('ui', False)).lower()}\n")
              out.write(f"needs_m2m={str(cfg['needs'].get('m2m', False)).lower()}\n")
          EOF

      # ── Cloudflare DNS ────────────────────────────────────────────────────────
      - name: Create Cloudflare CNAME
        if: steps.check.outputs.skip == 'false'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_TUNNEL_ID: ${{ secrets.CF_TUNNEL_ID }}
        run: |
          curl -sX POST "https://api.cloudflare.com/client/v4/zones/${CF_ZONE_ID}/dns_records" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data '{
              "type": "CNAME",
              "name": "${{ steps.config.outputs.subdomain }}.project-solomon.ai",
              "content": "'"${CF_TUNNEL_ID}"'.cfargotunnel.com",
              "proxied": true
            }'

      # ── Keycloak client ───────────────────────────────────────────────────────
      - name: Create Keycloak client and seal secret
        if: steps.check.outputs.skip == 'false'
        env:
          KEYCLOAK_URL: https://auth.project-solomon.ai
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KUBESEAL_PEM: ${{ secrets.KUBESEAL_PEM }}
          APP_NAME: ${{ steps.config.outputs.name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          pip install --quiet requests
          python3 - <<'EOF'
          import requests, os, subprocess, json, base64, tempfile

          app     = os.environ["APP_NAME"]
          ns      = os.environ["NAMESPACE"]
          kc_url  = os.environ["KEYCLOAK_URL"]
          kc_pass = os.environ["KEYCLOAK_ADMIN_PASSWORD"]

          r = requests.post(f"{kc_url}/realms/master/protocol/openid-connect/token", data={
              "grant_type": "password", "client_id": "admin-cli",
              "username": "admin", "password": kc_pass,
          })
          r.raise_for_status()
          token = r.json()["access_token"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          r = requests.post(f"{kc_url}/admin/realms/solomon/clients", headers=headers, json={
              "clientId": app, "name": app,
              "secret": None,
              "serviceAccountsEnabled": True,
              "standardFlowEnabled": False,
              "directAccessGrantsEnabled": False,
          })
          r.raise_for_status()
          client_uuid = r.headers["Location"].rstrip("/").split("/")[-1]

          r = requests.get(f"{kc_url}/admin/realms/solomon/clients/{client_uuid}/client-secret", headers=headers)
          r.raise_for_status()
          client_secret = r.json()["value"]

          pem = os.environ["KUBESEAL_PEM"]
          with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as f:
              f.write(pem)
              pem_path = f.name

          raw = subprocess.run([
              "kubectl", "create", "secret", "generic", "keycloak-client",
              f"--namespace={ns}",
              f"--from-literal=KEYCLOAK_CLIENT_ID={app}",
              f"--from-literal=KEYCLOAK_CLIENT_SECRET={client_secret}",
              "--dry-run=client", "-o", "yaml"
          ], capture_output=True, text=True, check=True).stdout

          sealed = subprocess.run([
              "kubeseal", "--cert", pem_path, "--format", "yaml"
          ], input=raw, capture_output=True, text=True, check=True).stdout

          with open("k8s/sealed-secrets/keycloak-client.yaml", "w") as f:
              f.write(sealed)
          print(f"Sealed keycloak-client for {app} in namespace {ns}")
          EOF

      # ── LiteLLM virtual key ───────────────────────────────────────────────────
      - name: Create LiteLLM virtual key and seal secret
        if: steps.check.outputs.skip == 'false' && steps.config.outputs.needs_llm == 'true'
        env:
          LITELLM_URL: http://litellm.ai.svc.cluster.local:4000
          LITELLM_MASTER_KEY: ${{ secrets.LITELLM_MASTER_KEY }}
          KUBESEAL_PEM: ${{ secrets.KUBESEAL_PEM }}
          APP_NAME: ${{ steps.config.outputs.name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          python3 - <<'EOF'
          import requests, os, subprocess, tempfile

          app          = os.environ["APP_NAME"]
          ns           = os.environ["NAMESPACE"]
          litellm_url  = os.environ["LITELLM_URL"]
          master_key   = os.environ["LITELLM_MASTER_KEY"]

          r = requests.post(f"{litellm_url}/key/generate",
              headers={"Authorization": f"Bearer {master_key}", "Content-Type": "application/json"},
              json={"key_alias": app, "metadata": {"app": app}},
          )
          r.raise_for_status()
          api_key = r.json()["key"]

          pem = os.environ["KUBESEAL_PEM"]
          with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as f:
              f.write(pem)
              pem_path = f.name

          raw = subprocess.run([
              "kubectl", "create", "secret", "generic", "litellm-api-key",
              f"--namespace={ns}",
              f"--from-literal=LITELLM_API_KEY={api_key}",
              "--dry-run=client", "-o", "yaml"
          ], capture_output=True, text=True, check=True).stdout

          sealed = subprocess.run([
              "kubeseal", "--cert", pem_path, "--format", "yaml"
          ], input=raw, capture_output=True, text=True, check=True).stdout

          with open("k8s/sealed-secrets/litellm-api-key.yaml", "w") as f:
              f.write(sealed)
          print(f"Sealed litellm-api-key for {app}")
          EOF

      # ── ArgoCD Application → platform repo ───────────────────────────────────
      - name: Commit ArgoCD Application to platform repo
        if: steps.check.outputs.skip == 'false'
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          APP_NAME: ${{ steps.config.outputs.name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          git clone \
            https://x-access-token:${PLATFORM_REPO_TOKEN}@github.com/stephenj-code/solomon.git \
            /tmp/solomon

          cat > /tmp/solomon/argocd-apps/${APP_NAME}.yaml <<EOF
          apiVersion: argoproj.io/v1alpha1
          kind: Application
          metadata:
            name: ${APP_NAME}
            namespace: argocd
            finalizers:
              - resources-finalizer.argocd.io
          spec:
            project: default
            source:
              repoURL: https://github.com/stephenj-code/${APP_NAME}
              targetRevision: main
              path: k8s
              directory:
                recurse: true
            destination:
              server: https://kubernetes.default.svc
              namespace: ${NAMESPACE}
            syncPolicy:
              automated:
                prune: true
                selfHeal: true
              syncOptions:
                - CreateNamespace=true
                - ServerSideApply=true
          EOF

          cd /tmp/solomon
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add argocd-apps/${APP_NAME}.yaml
          git commit -m "feat: add ArgoCD application for ${APP_NAME}"
          git push

      # ── LiteLLM allow policy → platform repo ─────────────────────────────────
      - name: Commit LiteLLM allow policy to platform repo
        if: steps.check.outputs.skip == 'false' && steps.config.outputs.needs_llm == 'true'
        env:
          PLATFORM_REPO_TOKEN: ${{ secrets.PLATFORM_REPO_TOKEN }}
          APP_NAME: ${{ steps.config.outputs.name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          cat > /tmp/solomon/infrastructure/ai/istio/allow-${APP_NAME}.yaml <<EOF
          apiVersion: security.istio.io/v1
          kind: AuthorizationPolicy
          metadata:
            name: allow-${APP_NAME}-to-litellm
            namespace: ai
          spec:
            selector:
              matchLabels:
                app: litellm
            action: ALLOW
            rules:
              - from:
                  - source:
                      principals:
                        - cluster.local/ns/${NAMESPACE}/sa/${APP_NAME}
          EOF

          cd /tmp/solomon
          git add infrastructure/ai/istio/allow-${APP_NAME}.yaml
          git commit -m "feat: allow ${APP_NAME} to call LiteLLM"
          git push

      # ── CloudNativePG database ────────────────────────────────────────────────
      - name: Commit CloudNativePG Database CR to platform repo
        if: steps.check.outputs.skip == 'false' && steps.config.outputs.needs_database == 'true'
        env:
          APP_NAME: ${{ steps.config.outputs.name }}
        run: |
          python3 - <<'EOF'
          import os, pathlib

          app = os.environ["APP_NAME"]
          db_dir = pathlib.Path("/tmp/solomon/infrastructure/database/databases")
          db_dir.mkdir(parents=True, exist_ok=True)

          manifest = f"""\
          apiVersion: postgresql.cnpg.io/v1
          kind: Database
          metadata:
            name: {app}
            namespace: database
          spec:
            cluster:
              name: shared
            name: {app}
            owner: {app}
          """
          (db_dir / f"{app}.yaml").write_text(manifest)
          EOF

          cd /tmp/solomon
          git add infrastructure/database/databases/${APP_NAME}.yaml
          git commit -m "feat: add CloudNativePG database for ${APP_NAME}"
          git push

      # ── Keycloak browser client + oauth2-proxy (UI apps) ─────────────────────
      - name: Create Keycloak browser client and oauth2-proxy config
        if: steps.check.outputs.skip == 'false' && steps.config.outputs.needs_ui == 'true'
        env:
          KEYCLOAK_URL: https://auth.project-solomon.ai
          KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.KEYCLOAK_ADMIN_PASSWORD }}
          KUBESEAL_PEM: ${{ secrets.KUBESEAL_PEM }}
          APP_NAME: ${{ steps.config.outputs.name }}
          NAMESPACE: ${{ steps.config.outputs.namespace }}
        run: |
          python3 - <<'EOF'
          import base64, os, pathlib, secrets as sec, subprocess, tempfile
          import requests

          app     = os.environ["APP_NAME"]
          ns      = os.environ["NAMESPACE"]
          kc_url  = os.environ["KEYCLOAK_URL"]
          kc_pass = os.environ["KEYCLOAK_ADMIN_PASSWORD"]

          r = requests.post(f"{kc_url}/realms/master/protocol/openid-connect/token", data={
              "grant_type": "password", "client_id": "admin-cli",
              "username": "admin", "password": kc_pass,
          })
          r.raise_for_status()
          token = r.json()["access_token"]
          headers = {"Authorization": f"Bearer {token}", "Content-Type": "application/json"}

          r = requests.post(f"{kc_url}/admin/realms/solomon/clients", headers=headers, json={
              "clientId": f"{app}-ui",
              "name": f"{app} UI",
              "standardFlowEnabled": True,
              "implicitFlowEnabled": False,
              "directAccessGrantsEnabled": False,
              "serviceAccountsEnabled": False,
              "redirectUris": [f"https://{app}.project-solomon.ai/oauth2/callback"],
              "webOrigins": [f"https://{app}.project-solomon.ai"],
          })
          r.raise_for_status()
          ui_uuid = r.headers["Location"].rstrip("/").split("/")[-1]

          r = requests.get(
              f"{kc_url}/admin/realms/solomon/clients/{ui_uuid}/client-secret",
              headers=headers
          )
          r.raise_for_status()
          client_secret = r.json()["value"]
          cookie_secret = base64.b64encode(sec.token_bytes(32)).decode()
          cookie_name   = f"_oauth2_proxy_{app.replace('-', '_')}"

          pem = os.environ["KUBESEAL_PEM"]
          with tempfile.NamedTemporaryFile("w", suffix=".pem", delete=False) as f:
              f.write(pem)
              pem_path = f.name

          raw = subprocess.run([
              "kubectl", "create", "secret", "generic", "oauth2-proxy-secrets",
              f"--namespace={ns}",
              f"--from-literal=OAUTH2_PROXY_CLIENT_SECRET={client_secret}",
              f"--from-literal=OAUTH2_PROXY_COOKIE_SECRET={cookie_secret}",
              "--dry-run=client", "-o", "yaml"
          ], capture_output=True, text=True, check=True).stdout

          sealed = subprocess.run(
              ["kubeseal", "--cert", pem_path, "--format", "yaml"],
              input=raw, capture_output=True, text=True, check=True
          ).stdout

          pathlib.Path("k8s/sealed-secrets").mkdir(parents=True, exist_ok=True)
          pathlib.Path("k8s/sealed-secrets/oauth2-proxy-secrets.yaml").write_text(sealed)

          proxy_manifest = f"""\
          ---
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: oauth2-proxy
            namespace: {ns}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: oauth2-proxy
            template:
              metadata:
                labels:
                  app: oauth2-proxy
              spec:
                containers:
                  - name: oauth2-proxy
                    image: quay.io/oauth2-proxy/oauth2-proxy:v7.7.1
                    args:
                      - --provider=oidc
                      - --oidc-issuer-url=https://keycloak.project-solomon.ai/realms/solomon
                      - --client-id={app}-ui
                      - --redirect-url=https://{app}.project-solomon.ai/oauth2/callback
                      - --upstream=http://{app}:80
                      - --email-domain=*
                      - --cookie-name={cookie_name}
                      - --cookie-domain=.project-solomon.ai
                      - --cookie-secure=true
                      - --cookie-samesite=lax
                      - --set-authorization-header=true
                      - --pass-authorization-header=true
                      - --set-xauthrequest=true
                      - --skip-auth-route=^/ping$
                      - --http-address=0.0.0.0:4180
                    env:
                      - name: OAUTH2_PROXY_CLIENT_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: oauth2-proxy-secrets
                            key: OAUTH2_PROXY_CLIENT_SECRET
                      - name: OAUTH2_PROXY_COOKIE_SECRET
                        valueFrom:
                          secretKeyRef:
                            name: oauth2-proxy-secrets
                            key: OAUTH2_PROXY_COOKIE_SECRET
                    ports:
                      - containerPort: 4180
                    resources:
                      requests:
                        cpu: 10m
                        memory: 32Mi
                      limits:
                        memory: 128Mi
                    readinessProbe:
                      httpGet:
                        path: /ping
                        port: 4180
                      initialDelaySeconds: 5
                      periodSeconds: 5
                    livenessProbe:
                      httpGet:
                        path: /ping
                        port: 4180
                      initialDelaySeconds: 10
                      periodSeconds: 10
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: oauth2-proxy
            namespace: {ns}
          spec:
            selector:
              app: oauth2-proxy
            ports:
              - port: 4180
                targetPort: 4180
          """
          pathlib.Path("k8s/oauth2-proxy.yaml").write_text(proxy_manifest)

          rt = pathlib.Path("k8s/httproute.yaml").read_text()
          rt = rt.replace(
              f"        - name: {app}\n          port: 80",
              f"        - name: oauth2-proxy\n          port: 4180"
          )
          pathlib.Path("k8s/httproute.yaml").write_text(rt)
          print(f"oauth2-proxy configured for {app} (UI mode)")
          EOF

      # ── Mark provisioned + commit sealed secrets ──────────────────────────────
      - name: Commit sealed secrets and mark provisioned
        if: steps.check.outputs.skip == 'false'
        run: |
          touch .provisioned
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/ .provisioned
          git commit -m "chore: seal secrets and mark provisioned"
          git push
