# All cluster SealedSecrets live in infrastructure/sealed-secrets/<namespace>/.
# This is the single place to find, review, and update every secret in the cluster.
# Wave 1: after namespaces (wave 0), alongside foundation — sealed-secrets controller
#         must be running before these can be unsealed; ArgoCD will retry until ready.
# Each SealedSecret file has metadata.namespace set — destination.namespace here is
# just a fallback default and is never actually used.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: sealed-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/sealed-secrets
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
