# Covers: nvr namespace — Frigate ServiceEntry + HTTPRoute + frigate-agent
# Frigate itself runs as Docker on agx-orin-prod-1 (not managed by ArgoCD)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nvr
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/nvr
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: nvr
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
