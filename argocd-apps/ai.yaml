# Covers: llama-server (Muse Glimmer 30B), vllm (Nemotron3 Nano), LiteLLM proxy
# Wave 7: after auth (wave 5) for JWT/AuthPolicy, database (wave 7) for LiteLLM DB.
# Both GPU workloads pin to agx-orin-prod-1 via nodeSelector.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ai
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/ai
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: ai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
