# Covers: MinIO StatefulSet + minio-setup Job + Velero Schedule CRs.
# Wave 7: after velero Helm app (wave 6) — Velero CRDs must exist before
# Schedule CRs can be synced. MinIO itself has no wave dependency.
# Velero operator is managed by argocd-apps/velero.yaml (Helm, wave 6).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: backup
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "7"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/backup
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: backup
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
