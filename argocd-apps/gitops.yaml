# ArgoCD self-management — syncs ArgoCD's own config from git.
# No sync-wave annotation — intentionally manual sync only.
# selfHeal: false — prevents ArgoCD from overwriting itself during upgrades.
# Sync manually after reviewing changes: argocd app sync gitops
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitops
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/gitops/argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
