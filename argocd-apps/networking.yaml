# Covers: Istio custom resources (GatewayClass, Gateway), cloudflared, NetworkPolicies.
# Istio control-plane (base, istiod, cni, ztunnel, ingressgateway) managed by
# separate istio-*.yaml ArgoCD Helm apps — sync waves 0-3.
# Wave 4: runs after all Istio components are ready.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: networking
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "4"
  finalizers:
    - resources-finalizer.argocd.io
spec:
  project: default
  source:
    repoURL: https://github.com/stephenj-code/solomon
    targetRevision: main
    path: infrastructure/networking
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: istio-system
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
